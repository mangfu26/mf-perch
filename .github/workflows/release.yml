# 发布流水线：推送 v* tag 时构建 Windows 安装包（NSIS + MSI），
# 用 CHANGELOG 对应小节创建 GitHub Release，并把 update.json 更新清单回写到 main（D55）。
# 本地等价命令：pnpm tauri build（产物在 src-tauri/target/release/bundle/）
name: Release

# tag 触发只能按名字模式过滤，**无法**限定"tag 打在哪个分支上"——
# 从哪条分支打 tag 由人控制（发布基线是 main，见 AGENTS.md §1.1）。
on:
  push:
    tags:
      - 'v*'
  # 构建失败后可手动指定已有 tag 重跑，不必删掉 tag 重打
  workflow_dispatch:
    inputs:
      tag:
        description: '要重新发布的 tag（如 v0.1.0）'
        required: true

# 创建 Release 需要写权限
permissions:
  contents: write

# 同一 tag 的两个并发运行会互相覆盖 Release
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  # push tag 时 ref_name 即 tag 名；手动触发时取输入。版本校验与 Release 都以它为准
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  BUNDLE_DIR: src-tauri/target/release/bundle

jobs:
  release:
    name: Build & Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      # 与开发机的 pnpm 主次版本保持一致
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 安装包文件名里的版本来自 tauri.conf.json，Release 下载 URL 里的版本来自 tag。
      # 两者不一致时，Release 挂的是 0.1.0 的包、清单指向 v0.2.0 的路径 → 用户 404。
      - name: Verify tag matches app version
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $appVer = $conf.version
          $tagVer = ($env:RELEASE_TAG -replace '^v', '')
          if ($tagVer -notmatch '^\d+\.\d+\.\d+$') {
            throw "tag 必须是 vX.Y.Z 形式（实际: $env:RELEASE_TAG）"
          }
          if ($tagVer -ne $appVer) {
            throw "tag 版本 $tagVer 与应用版本 $appVer 不一致：先同步 tauri.conf.json 的 version，再打 tag"
          }
          Write-Host "tag $env:RELEASE_TAG 与应用版本一致"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 门禁：AGENTS.md §5.10 的默认门禁。
      # 带 #[ignore] 的真实环境用例不在 CI 跑——它们依赖开发机上的 WSL SSH 服务器。
      - name: Gate - secret scan
        run: pnpm check:secrets

      - name: Gate - IPC contract
        run: pnpm check:ipc

      - name: Gate - frontend tests
        run: pnpm test

      # typecheck 单独提前跑，失败时省掉后面 cargo test 的几分钟编译
      # （tauri build 的 beforeBuildCommand 会再跑一次 vue-tsc，幂等）
      - name: Gate - typecheck
        run: pnpm typecheck

      - name: Gate - cargo test
        working-directory: src-tauri
        # 并行度取默认值：-j 2 是低内存 / target 在慢盘上的开发机降级，runner 不属于该条件
        run: cargo test

      # ── 构建：bundle.targets = "all" → 一次出 nsis/*.exe 与 msi/*.msi
      - name: Build installers
        run: pnpm tauri build

      # 发布说明 = CHANGELOG.md 中该 tag 的小节（开源规范，正文不出现内部流程信息）。
      # 找不到小节直接失败：强制"发版必须先写变更日志"，杜绝空说明或抄旧版说明。
      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## \[$([regex]::Escape($env:RELEASE_TAG))\]") { $start = $i; break }
          }
          if ($start -lt 0) { throw "CHANGELOG.md 没有 $env:RELEASE_TAG 小节：发布说明取自 CHANGELOG，请先补写" }
          $body = @()
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## ') { break }
            $body += $lines[$i]
          }
          $notes = ($body -join "`n").Trim()
          if (-not $notes) { throw "$env:RELEASE_TAG 小节内容为空" }
          $notes | Out-File -FilePath release-notes.md -Encoding utf8NoBOM
          $notes | Out-File -FilePath $env:RUNNER_TEMP\notes.txt -Encoding utf8NoBOM
          Write-Host $notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            ${{ env.BUNDLE_DIR }}/nsis/*.exe
            ${{ env.BUNDLE_DIR }}/msi/*.msi

      # 更新清单 update.json（D55）：version / url / sha256 / size 全部取自
      # 真实 tag 与真实构建产物，随发布自动回写 main——程序读 raw/main/update.json，
      # 从此没有"忘记更新版本信息"这一类故障。
      - name: Publish update manifest to main
        shell: pwsh
        run: |
          $ver = ($env:RELEASE_TAG -replace '^v', '')
          $file = Get-ChildItem -Path "$env:BUNDLE_DIR/msi" -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $file) {
            $file = Get-ChildItem -Path "$env:BUNDLE_DIR/nsis" -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $file) { throw "找不到安装包，无法生成清单" }
          $manifest = @{
            version   = $ver
            notes     = (Get-Content "$env:RUNNER_TEMP\notes.txt" -Raw).Trim()
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              'windows-x86_64' = @{
                url    = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$($file.Name)"
                sha256 = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLower()
                size   = $file.Length
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File -FilePath "$env:RUNNER_TEMP\update.json" -Encoding utf8NoBOM
          # 以 main 最新提交为基底回写，避免把 tag 处的旧树推上去
          git fetch origin main
          git checkout -B main FETCH_HEAD
          Copy-Item "$env:RUNNER_TEMP\update.json" update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore(release): 发布 $env:RELEASE_TAG 更新清单"
          git push origin main
